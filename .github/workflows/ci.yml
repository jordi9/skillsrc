name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt-check
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -ldflags "-X github.com/jordi9/skillsrc/internal/skillsrc.Version=ci" -o skillsrc ./cmd/skillsrc
      - run: test "$(./skillsrc --version)" = "skillsrc ci"

