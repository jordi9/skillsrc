name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - if: matrix.os == 'ubuntu-latest'
        run: make fmt-check
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -ldflags "-X github.com/jordi9/skillsrc/internal/skillsrc.Version=ci" -o skillsrc ./cmd/skillsrc
      - run: test "$(./skillsrc --version)" = "skillsrc ci"

