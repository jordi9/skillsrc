name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Verify
        run: |
          go test ./...
          go vet ./...

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Verify release build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          goreleaser build --clean --single-target --output /tmp/skillsrc
          test "$(/tmp/skillsrc version)" = "skillsrc $VERSION"

      - name: Generate release notes
        uses: orhun/git-cliff-action@11ab60a12325cc82a96afbf3fb3907481e27ab96
        id: notes
        with:
          config: cliff.toml
          args: --latest --tag-pattern "^v[0-9].*"
          version: v2.13.1

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          goreleaser release --clean \
            --release-notes "${{ steps.notes.outputs.changelog }}"
