name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Verify
        run: |
          go test ./...
          go vet ./...

      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*}
            arch=${target#*/}
            stage=$(mktemp -d)
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
              -trimpath \
              -ldflags "-s -w -X github.com/jordi9/skillsrc/internal/skillsrc.Version=$VERSION" \
              -o "$stage/skillsrc" ./cmd/skillsrc
            cp LICENSE "$stage/LICENSE"
            tar -C "$stage" -czf "dist/skillsrc_${VERSION}_${os}_${arch}.tar.gz" skillsrc LICENSE
            rm -rf "$stage"
          done
          tar -xOzf "dist/skillsrc_${VERSION}_linux_amd64.tar.gz" skillsrc > /tmp/skillsrc
          chmod +x /tmp/skillsrc
          test "$(/tmp/skillsrc version)" = "skillsrc $VERSION"
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: notes
        with:
          config: cliff.toml
          args: --latest --tag-pattern "^v[0-9].*"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ steps.notes.outputs.content }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --title "$RELEASE_TAG" \
            --notes "$RELEASE_NOTES"
