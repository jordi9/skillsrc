[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

"""
body = """
{% if version %}
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif %}

{% if version == "v0.1.0" %}
Initial public release of `skillsrc`.

- Declare and lock skills from Git repositories or local directories.
- Reproduce exact `.agents/skills` installations across machines.
- Detect drift and protect unmanaged skills with ownership-aware updates.
{% endif %}
### Changes
{% for commit in commits | sort(attribute="message") %}
- {{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/jordi9/skillsrc/commit/{{ commit.id }}))\
{% endfor %}
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
tag_pattern = "^v[0-9].*"
