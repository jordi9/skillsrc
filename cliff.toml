[changelog]
header = ""
body = """
{% if version == "v0.1.0" %}
Initial public release of `skillsrc`.

- Declare and lock skills from Git repositories or local directories.
- Reproduce exact `.agents/skills` installations across machines.
- Detect drift and protect unmanaged skills with ownership-aware updates.
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/jordi9/skillsrc/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
tag_pattern = "^v[0-9].*"
commit_parsers = [
  { message = "^feat(\\(.+\\))?:", group = "🚀 Features" },
  { message = "^fix(\\(.+\\))?:", group = "🐛 Bug Fixes" },
  { message = "^perf(\\(.+\\))?:", group = "⚡ Performance" },
  { message = "^refactor(\\(.+\\))?:", group = "🔧 Refactor" },
  { message = "^docs(\\(.+\\))?:", group = "📚 Documentation" },
  { message = "^test(\\(.+\\))?:", group = "🧪 Testing" },
  { message = "^build(\\(.+\\))?:", group = "📦 Build" },
  { message = "^ci(\\(.+\\))?:", group = "🔄 CI" },
  { message = "^chore(\\(.+\\))?:", skip = true },
  { message = ".*", group = "Changes" },
]
