version: "2"

linters:
  enable:
    - cyclop
    - funlen
    - gocognit
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    cyclop:
      max-complexity: 15
    funlen:
      lines: 100
      statements: 60
    gocognit:
      min-complexity: 30
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - funlen
          - gocognit
